name: Size tests FM tradeoffs

on:
  push:
    branches:
      - fm-broadcast

permissions:
  contents: read

jobs:
  size-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make python3 python3-crcmod
      - name: Try variants
        shell: bash
        run: |
          set +e
          try_build() {
            name="$1"; shift
            echo "===== $name ====="
            make clean >/dev/null 2>&1
            make ENABLE_FMRADIO=1 VERSION_STRING=v1.5FM "$@" >"$name.log" 2>&1
            rc=$?
            tail -n 12 "$name.log"
            if [ $rc -eq 0 ]; then arm-none-eabi-size vuurwerk-v1.5.1; fi
            echo "RESULT $name rc=$rc"
          }
          try_build no_flashlight ENABLE_FLASHLIGHT=0
          try_build no_cosmetics ENABLE_FLASHLIGHT=0 ENABLE_RSSI_BAR=0 ENABLE_COPY_CHAN_TO_VFO=0
          try_build stock_menu ENABLE_CUSTOM_MENU_LAYOUT=0
          try_build stock_menu_no_flash ENABLE_CUSTOM_MENU_LAYOUT=0 ENABLE_FLASHLIGHT=0
          try_build stock_menu_no_cosmetics ENABLE_CUSTOM_MENU_LAYOUT=0 ENABLE_FLASHLIGHT=0 ENABLE_RSSI_BAR=0 ENABLE_COPY_CHAN_TO_VFO=0
          exit 0
