name: Build VUURWERK 1.5.1 FM

on:
  push:
    branches:
      - fm-broadcast
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make python3 python3-crcmod

      - name: Build FM variant
        run: |
          make clean
          make ENABLE_FMRADIO=1 VERSION_STRING=v1.5FM

      - name: Verify size and files
        run: |
          arm-none-eabi-size vuurwerk-v1.5.1
          test -f vuurwerk-v1.5.1.bin
          test -f vuurwerk-v1.5.1.packed.bin
          wc -c vuurwerk-v1.5.1.bin vuurwerk-v1.5.1.packed.bin
          sha256sum vuurwerk-v1.5.1.bin vuurwerk-v1.5.1.packed.bin | tee SHA256SUMS.txt

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: vuurwerk-v1.5.1-FM
          path: |
            vuurwerk-v1.5.1.bin
            vuurwerk-v1.5.1.packed.bin
            SHA256SUMS.txt
