name: Build PY2ALC Fox Hunt + FM Broadcast

on:
  push:
    branches:
      - py2alc-foxhunt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test F4HWN AM demodulator profile
        run: |
          gcc -std=c11 -Wall -Wextra -Werror tests/test_f4am.c -o /tmp/test_f4am
          /tmp/test_f4am

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi \
            libnewlib-dev libnewlib-arm-none-eabi \
            make python3-crcmod

      - name: Restore F+0 Broadcast FM shortcut
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/main.c')
          s = p.read_text()
          old = '\t\tcase 0: { // F+0 = FM -- cycle modulation (matches "0 FM")\n\t\t\tgTxVfo->Modulation = (gTxVfo->Modulation + 1) % 3;\n\t\t\tgRequestSaveChannel = 1;\n\t\t\tTOAST_Show(gTxVfo->Modulation == 0 ? "MOD: FM" :\n\t\t\t           gTxVfo->Modulation == 1 ? "MOD: AM" : "MOD: USB");\n\t\t\tbreak;\n\t\t}\n'
          new = '\t\tcase 0: { // F+0 = FM Broadcast\n#ifdef ENABLE_FMRADIO\n\t\t\tACTION_FM();\n#else\n\t\t\tgBeepToPlay = BEEP_500HZ_60MS_DOUBLE_BEEP_OPTIONAL;\n#endif\n\t\t\tbreak;\n\t\t}\n'
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Apply F4HWN aviation AM demodulator + volume boost
        run: python3 tools/apply_f4am.py

      - name: Build PY2ALC Fox Hunt F4AM VOL
        run: |
          make clean
          make \
            ENABLE_FMRADIO=1 \
            ENABLE_SPECTRUM=1 \
            ENABLE_AM_FIX=1 \
            ENABLE_RSSI_BAR=1 \
            ENABLE_TX_WHEN_AM=1 \
            VERSION_STRING=v1.5FV

      - name: Verify image
        run: |
          arm-none-eabi-size vuurwerk-v1.5.1 | tee SIZE.txt
          wc -c vuurwerk-v1.5.1.bin vuurwerk-v1.5.1.packed.bin | tee -a SIZE.txt
          test $(wc -c < vuurwerk-v1.5.1.bin) -le 61440
          sha256sum vuurwerk-v1.5.1.bin vuurwerk-v1.5.1.packed.bin | tee SHA256SUMS.txt

      - name: Stage files
        run: |
          cp vuurwerk-v1.5.1.bin PY2ALC_VUURWERK_FOXHUNT_FM_F4AM_VOL.bin
          cp vuurwerk-v1.5.1.packed.bin PY2ALC_VUURWERK_FOXHUNT_FM_F4AM_VOL.packed.bin

      - uses: actions/upload-artifact@v4
        with:
          name: PY2ALC_VUURWERK_FOXHUNT_FM_F4AM_VOL
          path: |
            PY2ALC_VUURWERK_FOXHUNT_FM_F4AM_VOL.bin
            PY2ALC_VUURWERK_FOXHUNT_FM_F4AM_VOL.packed.bin
            SIZE.txt
            SHA256SUMS.txt
