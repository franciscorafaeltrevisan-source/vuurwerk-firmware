name: Build PY2ALC Fox Hunt + FM Broadcast

on:
  push:
    branches:
      - py2alc-foxhunt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi \
            libnewlib-dev libnewlib-arm-none-eabi \
            make python3-crcmod
      - name: Restore F+0 Broadcast FM shortcut
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/main.c')
          s = p.read_text()
          old = '''\t\tcase 0: { // F+0 = FM -- cycle modulation (matches "0 FM")
\t\t\tgTxVfo->Modulation = (gTxVfo->Modulation + 1) % 3;
\t\t\tgRequestSaveChannel = 1;
\t\t\tTOAST_Show(gTxVfo->Modulation == 0 ? "MOD: FM" :
\t\t\t           gTxVfo->Modulation == 1 ? "MOD: AM" : "MOD: USB");
\t\t\tbreak;
\t\t}
'''
          new = '''\t\tcase 0: { // F+0 = FM Broadcast
          #ifdef ENABLE_FMRADIO
\t\t\tACTION_FM();
          #else
\t\t\tgBeepToPlay = BEEP_500HZ_60MS_DOUBLE_BEEP_OPTIONAL;
          #endif
\t\t\tbreak;
\t\t}
'''
          if old not in s:
              raise SystemExit('F+0 source block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Build PY2ALC Fox Hunt
        run: |
          make clean
          make \
            ENABLE_FMRADIO=1 \
            ENABLE_SPECTRUM=1 \
            ENABLE_AM_FIX=1 \
            ENABLE_RSSI_BAR=1 \
            ENABLE_TX_WHEN_AM=1 \
            VERSION_STRING=v1.5FX
      - name: Verify image
        run: |
          arm-none-eabi-size vuurwerk-v1.5.1 | tee SIZE.txt
          wc -c vuurwerk-v1.5.1.bin vuurwerk-v1.5.1.packed.bin | tee -a SIZE.txt
          test $(wc -c < vuurwerk-v1.5.1.bin) -le 61440
          sha256sum vuurwerk-v1.5.1.bin vuurwerk-v1.5.1.packed.bin | tee SHA256SUMS.txt
      - name: Stage files
        run: |
          cp vuurwerk-v1.5.1.bin PY2ALC_VUURWERK_FOXHUNT_FM.bin
          cp vuurwerk-v1.5.1.packed.bin PY2ALC_VUURWERK_FOXHUNT_FM.packed.bin
      - uses: actions/upload-artifact@v4
        with:
          name: PY2ALC_VUURWERK_FOXHUNT_FM
          path: |
            PY2ALC_VUURWERK_FOXHUNT_FM.bin
            PY2ALC_VUURWERK_FOXHUNT_FM.packed.bin
            SIZE.txt
            SHA256SUMS.txt
